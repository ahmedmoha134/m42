@layer base {
  html, body {
    font-family: 'Tajawal', sans-serif;
    direction: rtl;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
}
.font-display {
  font-family: 'Baloo Bhaijaan 2', 'Tajawal', cursive, sans-serif;
}
.font-ui {
  font-family: 'Tajawal', sans-serif;
}
.stadium-card {
  background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
  border: 3.5px solid #16a34a;
  box-shadow: 0 7px 0 #166534, 0 16px 34px rgba(5, 46, 34, 0.38);
}
.gold-badge {
  background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
  border: 3px solid #92400e;
  box-shadow: 0 5px 0 #78350f, inset 0 2px 0 rgba(255, 255, 255, 0.75);
}
.btn-pitch {
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, filter 0.15s ease;
}
.btn-pitch:hover:not(:disabled) {
  transform: translateY(-2px) scale(1.02);
  filter: brightness(1.04);
}
.btn-pitch:active:not(:disabled) {
  transform: translateY(4px) scale(0.98);
}
.pitch-stripes {
  background-image: repeating-linear-gradient( 90deg, #22c55e 0px, #22c55e 46px, #16a34a 46px, #16a34a 92px );
}
@keyframes ballSpin {
  from {
    transform: rotate(0deg) translateX(0);
  }
  to {
    transform: rotate(360deg) translateX(0);
  }
}
@keyframes ballKick {
  0% {
    transform: translate(0, 0) scale(1) rotate(0deg);
  }
  35% {
    transform: translate(0, -28px) scale(1.12) rotate(200deg);
  }
  70% {
    transform: translate(var(--kick-x, 0px), -14px) scale(0.98) rotate(420deg);
  }
  100% {
    transform: translate(var(--kick-x, 0px), 0) scale(1) rotate(540deg);
  }
}
@keyframes goalNetFlash {
  0% {
    opacity: 0.2;
    transform: scale(0.94);
  }
  50% {
    opacity: 1;
    transform: scale(1.04);
  }
  100% {
    opacity: 0.35;
    transform: scale(1);
  }
}

  0%, 100% {

  }
  40% {
    transform: translateX(7px) rotate(2deg);
  }
  60% {

  }
  80% {
    transform: translateX(5px) rotate(1deg);
  }
}

  }

    box-shadow: 0 0 26px 10px rgba(253, 224, 71, 0.85), 0 6px 0 #92400e;
  }
}
.animate-ball-spin {
  animation: ballSpin 0.6s linear infinite;
}
.animate-ball-kick {
  animation: ballKick 0.85s cubic-bezier(0.4, 0, 0.3, 1) forwards;
}
.animate-net-flash {
  animation: goalNetFlash 0.9s ease-out forwards;
}
.animate-keeper-dive {
  animation: keeperDive 0.8s cubic-bezier(0.3, 1.2, 0.5, 1) forwards;
}
.animate-nudge {
  animation: gentleNudge 0.45s ease-in-out;
}
.animate-pop-in {
  animation: popCelebrate 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.animate-float-token {
  animation: floatToken 3s ease-in-out infinite;
}
.animate-glow-gold {
  animation: glowGold 2s ease-in-out infinite;
}
